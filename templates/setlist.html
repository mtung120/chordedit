<!DOCTYPE html>
<html>
<head>
    <title>Setlist: {{.Name}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Home Screen web app: opens full-screen, without Safari's bars. -->
    <link rel="manifest" href="{{asset "static/manifest.webmanifest"}}">
    <link rel="icon" href="{{asset "static/images/favicon.svg"}}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{asset "static/images/icon-180.png"}}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ChordEdit">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{asset "static/css/styles.css"}}">
    <script>
        window.setlistOriginalName = {{.Name}};
        window.setlistInitial = {{.SetlistJS}};
        window.setlistExists = {{.Exists}};
        window.songData = {{.SongDataJS}};
    </script>
</head>
<body class="setlist-page">
    <div class="site-header">
        <a href="/music/songs" class="site-logo" aria-label="ChordEdit"><svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.4" fill="#18181B"/><rect x="22" y="24" width="42" height="30" rx="9" fill="#EF4444"/><rect x="22" y="64" width="56" height="11" rx="5.5" fill="#FAFAFA"/></svg></a>
    </div>
    <div class="main-content">
        <div class="song-list-container setlist-editor-container">
            <div class="song-list-header">
                <div class="song-list-title-group">
                    <h2 class="song-list-title">
                        <span class="setlist-title-prefix">Setlist</span>
                        <input type="text" class="setlist-name-input" placeholder="Setlist name" autocomplete="off" aria-label="Setlist name">
                    </h2>
                    <span class="song-count setlist-songs-count">0 songs</span>
                </div>
                <div class="setlist-header-actions">
                    <span class="setlist-save-indicator" aria-live="polite"></span>
                    <button type="button" class="new-song-button setlist-edit-toggle" aria-pressed="false">Edit</button>
                    <button type="button" class="new-song-button setlist-add-song-btn" hidden>Add song</button>
                </div>
            </div>

            <ol class="song-list setlist-songs-list"></ol>

            <div class="setlist-danger-zone">
                <button type="button" class="setlist-delete-btn">Delete setlist</button>
            </div>
        </div>

        <!-- Song picker modal -->
        <div class="song-picker-overlay" hidden>
            <div class="song-picker-modal" role="dialog" aria-modal="true" aria-label="Add a song">
                <div class="song-picker-header">
                    <input type="text" class="song-picker-search" placeholder="Search songs…" autocomplete="off">
                    <button type="button" class="song-picker-close" aria-label="Close">×</button>
                </div>
                <div class="song-picker-list"></div>
            </div>
        </div>
    </div>
    {{vite "setlist"}}
</body>
</html>
